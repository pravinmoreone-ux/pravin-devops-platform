---
- name: Update installed packages
  ansible.builtin.dnf:
    name: "*"
    state: latest

- name: Install application server packages
  ansible.builtin.dnf:
    name:
      - git
      - python3
      - python3-pip
      - jq
      - unzip
      - tar
      - gzip
    state: present

- name: Create application user
  ansible.builtin.user:
    name: appuser
    shell: /bin/bash
    create_home: true
    state: present

- name: Create application directory
  ansible.builtin.file:
    path: /opt/app
    state: directory
    owner: appuser
    group: appuser
    mode: "0755"

- name: Install Java
  ansible.builtin.import_tasks: java.yml

- name: Configure application systemd service
  ansible.builtin.import_tasks: systemd.yml
