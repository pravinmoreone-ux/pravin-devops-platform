# OpenTelemetry Collector values
# Chart: open-telemetry/opentelemetry-collector v0.106.0

# Deployment mode: daemonset (node-level) + deployment (cluster-level)
mode: "daemonset"

# DaemonSet for node-level collection (host metrics, logs)
daemonset:
  enabled: true
  config:
    receivers:
      # Host metrics
      hostmetrics:
        collection_interval: 30s
        scrapers:
          cpu: {}
          disk: {}
          filesystem: {}
          load: {}
          memory: {}
          network: {}
          process: {}
          processes: {}
          paging: {}
      # Kubernetes metrics via kubelet
      prometheus:
        config:
          scrape_configs:
            - job_name: 'kubernetes-nodes'
              kubernetes_sd_configs:
                - role: node
              relabel_configs:
                - action: labelmap
                  regex: __meta_kubernetes_node_label_(.+)
            - job_name: 'kubernetes-pods'
              kubernetes_sd_configs:
                - role: pod
              relabel_configs:
                - action: keep
                  source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_scrape]
                  regex: true
                - action: replace
                  source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_path]
                  target_label: __metrics_path__
                  regex: (.+)
                - action: replace
                  source_labels: [__address__, __meta_kubernetes_pod_annotation_prometheus_io_port]
                  target_label: __address__
                  regex: ([^:]+)(?::\d+)?;(\d+)
                  replacement: $1:$2
                - action: labelmap
                  regex: __meta_kubernetes_pod_label_(.+)
      # Kubernetes events
      k8sevents: {}
    processors:
      batch:
        timeout: 10s
        send_batch_size: 1024
      memory_limiter:
        check_interval: 1s
        limit_mib: 512
      k8sattributes:
        auth_type: "serviceAccount"
        passthrough: false
        extract:
          metadata:
            - k8s.pod.name
            - k8s.pod.uid
            - k8s.namespace.name
            - k8s.deployment.name
            - k8s.statefulset.name
            - k8s.daemonset.name
            - k8s.job.name
            - k8s.cronjob.name
            - k8s.container.name
      resourcedetection:
        detectors: [env, gcp, ec2, azure]
        timeout: 5s
    exporters:
      prometheus:
        endpoint: "0.0.0.0:8889"
        const_labels:
          cluster: "pravin-devops-platform"
      otlp:
        endpoint: "tempo.tracing.svc.cluster.local:4317"
        tls:
          insecure: true
      loki:
        endpoint: "http://loki.logging.svc.cluster.local:3100/loki/api/v1/push"
      logging:
        loglevel: info
    service:
      pipelines:
        metrics:
          receivers: [hostmetrics, prometheus]
          processors: [batch, memory_limiter, k8sattributes, resourcedetection]
          exporters: [prometheus, logging]
        traces:
          receivers: [otlp]
          processors: [batch, memory_limiter, k8sattributes, resourcedetection]
          exporters: [otlp, logging]
        logs:
          receivers: [k8sevents]
          processors: [batch, memory_limiter, k8sattributes, resourcedetection]
          exporters: [loki, logging]
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 1Gi
  securityContext:
    runAsNonRoot: true
    runAsUser: 10001
    fsGroup: 10001
    readOnlyRootFilesystem: true
    allowPrivilegeEscalation: false
    capabilities:
      drop:
        - ALL
  hostNetwork: true
  hostPID: true

# Deployment for cluster-level collection (OTLP receiver for applications)
deployment:
  enabled: true
  replicaCount: 2
  config:
    receivers:
      otlp:
        protocols:
          grpc:
            endpoint: 0.0.0.0:4317
          http:
            endpoint: 0.0.0.0:4318
    processors:
      batch:
        timeout: 10s
        send_batch_size: 1024
      memory_limiter:
        check_interval: 1s
        limit_mib: 512
      k8sattributes:
        auth_type: "serviceAccount"
        passthrough: false
        extract:
          metadata:
            - k8s.pod.name
            - k8s.pod.uid
            - k8s.namespace.name
            - k8s.deployment.name
            - k8s.container.name
      resourcedetection:
        detectors: [env, gcp, ec2, azure]
        timeout: 5s
    exporters:
      prometheus:
        endpoint: "0.0.0.0:8889"
        const_labels:
          cluster: "pravin-devops-platform"
      otlp:
        endpoint: "tempo.tracing.svc.cluster.local:4317"
        tls:
          insecure: true
      loki:
        endpoint: "http://loki.logging.svc.cluster.local:3100/loki/api/v1/push"
      logging:
        loglevel: info
    service:
      pipelines:
        metrics:
          receivers: [otlp]
          processors: [batch, memory_limiter, k8sattributes, resourcedetection]
          exporters: [prometheus, logging]
        traces:
          receivers: [otlp]
          processors: [batch, memory_limiter, k8sattributes, resourcedetection]
          exporters: [otlp, logging]
        logs:
          receivers: [otlp]
          processors: [batch, memory_limiter, k8sattributes, resourcedetection]
          exporters: [loki, logging]
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 1Gi
  securityContext:
    runAsNonRoot: true
    runAsUser: 10001
    fsGroup: 10001
    readOnlyRootFilesystem: true
    allowPrivilegeEscalation: false
    capabilities:
      drop:
        - ALL

# ServiceMonitor for Prometheus to scrape OTel Collector metrics
serviceMonitor:
  enabled: true
  interval: 30s
  namespace: monitoring
  labels:
    release: kube-prometheus-stack

# PrometheusRule for alerting on OTel Collector health
prometheusRule:
  enabled: true
  namespace: monitoring
  labels:
    release: kube-prometheus-stack