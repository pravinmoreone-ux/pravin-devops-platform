# Loki values for log aggregation
# Chart: grafana/loki-stack v2.9.8

loki:
  enabled: true
  auth_enabled: false
  
  # Single binary mode for simplicity (dev/staging)
  # For production, use microservices mode with separate components
  deploymentMode: SingleBinary
  
  # Persistence
  persistence:
    enabled: true
    storageClassName: gp3
    accessModes:
      - ReadWriteOnce
    size: 20Gi
  
  # Configuration
  config: |
    auth_enabled: false
    
    server:
      http_listen_port: 3100
      grpc_listen_port: 9096
      log_level: info
    
    common:
      path_prefix: /loki
      storage:
        filesystem:
          chunks_directory: /loki/chunks
          rules_directory: /loki/rules
      replication_factor: 1
      ring:
        instance_addr: 127.0.0.1
        kvstore:
          store: inmemory
    
    schema_config:
      configs:
        - from: 2024-01-01
          store: boltdb-shipper
          object_store: filesystem
          schema: v11
          index:
            prefix: index_
            period: 24h
    
    limits_config:
      reject_old_samples: true
      reject_old_samples_max_age: 168h
      ingestion_rate_mb: 20
      ingestion_burst_size_mb: 40
      per_stream_rate_limit: 10MB
      per_stream_rate_limit_burst: 20MB
      max_entries_limit_per_query: 5000
      max_global_streams_per_user: 10000
    
    chunk_store_config:
      max_look_back_period: 30d
    
    table_manager:
      retention_deletes_enabled: true
      retention_period: 30d
  
  # Resources
  resources:
    requests:
      cpu: 200m
      memory: 512Mi
    limits:
      cpu: 1000m
      memory: 2Gi
  
  # Security
  securityContext:
    runAsNonRoot: true
    runAsUser: 10001
    fsGroup: 10001
    readOnlyRootFilesystem: true
    allowPrivilegeEscalation: false
    capabilities:
      drop:
        - ALL
  
  # Service
  service:
    type: ClusterIP
    port: 3100
  
  # Ingress (optional)
  # ingress:
  #   enabled: true
  #   hosts:
  #     - loki.example.com

# Promtail for log collection
promtail:
  enabled: true
  config:
    clients:
      - url: http://loki.logging.svc.cluster.local:3100/loki/api/v1/push
    logLevel: info
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 200m
      memory: 256Mi
  securityContext:
    runAsNonRoot: true
    runAsUser: 0  # Needs root to read /var/log
    readOnlyRootFilesystem: true
    allowPrivilegeEscalation: false
  # Scrape all container logs
  extraArgs:
    - "-config.file=/etc/promtail/config.yaml"