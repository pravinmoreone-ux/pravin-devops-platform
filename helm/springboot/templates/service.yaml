apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-springboot
  labels:
    app: springboot
spec:
  type: {{ .Values.service.type }}

  selector:
    app: springboot

  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
