name: Spring Boot CI

on:
  pull_request:
    paths:
      - "apps/springboot/**"
      - ".github/workflows/springboot-ci.yml"

  push:
    branches:
      - main
    paths:
      - "apps/springboot/**"
      - ".github/workflows/springboot-ci.yml"

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ghcr.io/pravinmoreone-ux/pravin-devops-platform/springboot

jobs:
  build:
    name: Build and Push Spring Boot
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: apps/springboot

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Build and test
        run: mvn -B clean test package

      - name: Generate image tag
        id: image
        run: echo "tag=sha-${GITHUB_SHA}" >> "$GITHUB_OUTPUT"

      - name: Show image tag
        run: echo "Image tag: ${{ steps.image.outputs.tag }}"

      - name: Build Docker image
        run: docker build -t "${IMAGE_NAME}:${{ steps.image.outputs.tag }}" .

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push Docker image
        run: docker push "${IMAGE_NAME}:${{ steps.image.outputs.tag }}"