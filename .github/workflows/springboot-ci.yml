name: Spring Boot CI

on:
  pull_request:
    paths:
      - "apps/springboot/**"
      - ".github/workflows/springboot-ci.yml"

  push:
    branches:
      - main
    paths:
      - "apps/springboot/**"
      - ".github/workflows/springboot-ci.yml"

permissions:
  contents: write
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ghcr.io/pravinmoreone-ux/pravin-devops-platform/springboot

jobs:
  build:
    name: Build and Push Spring Boot
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: apps/springboot

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Build and test
        run: mvn -B clean test package

      - name: SonarCloud SAST
        run: >
          mvn -B org.sonarsource.scanner.maven:sonar-maven-plugin:sonar
          -Dsonar.organization=pravinmoreone-ux
          -Dsonar.projectKey=pravin-devops-platform
          -Dsonar.branch.name=main
          -Dsonar.qualitygate.wait=true
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

      - name: Generate image tag
        id: image
        run: |
          echo "tag=sha-${GITHUB_SHA}" >> "$GITHUB_OUTPUT"

      - name: Show image tag
        run: |
          echo "Image tag: ${{ steps.image.outputs.tag }}"

      - name: Build Docker image
        run: |
          docker build -t "${IMAGE_NAME}:${{ steps.image.outputs.tag }}" .

      - name: Log in to GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push Docker image
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: docker push "${IMAGE_NAME}:${{ steps.image.outputs.tag }}"

      - name: Update Helm image tag
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          sed -i -E 's/^  tag: ".*"/  tag: "${{ steps.image.outputs.tag }}"/' ../../helm/springboot/values.yaml

          if git diff --quiet -- ../../helm/springboot/values.yaml; then
            echo "Helm image tag already up to date."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"



          git add ../../helm/springboot/values.yaml
          git commit -m "Update Spring Boot image to ${{ steps.image.outputs.tag }}"
          git push